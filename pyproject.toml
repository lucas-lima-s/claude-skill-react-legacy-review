[project]
name = "claude-skill-react-legacy-review"
version = "0.1.0"
description = "A Claude Code skill: review checklist for legacy React 16 plus Redux-Saga browser-rendered apps."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lucas de Lima" }]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
